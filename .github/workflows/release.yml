name: Release

# Publishes kio-macros then kio to crates.io when main carries a version crates.io lacks.
# Packaging runs in an unprivileged job before publishing so build scripts never run beside
# the OIDC token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      macros: ${{ steps.plan.outputs.macros }}
      kio: ${{ steps.plan.outputs.kio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          # Whether crates.io lacks the version; any answer but found or missing fails the
          # run, so an outage never passes for "already published".
          check_crate() {
            local name="$1" version="$2"
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "kixel-ai/kio release" \
              "https://crates.io/api/v1/crates/${name}/${version}")
            case "$status" in
              404) echo "true" ;;
              200) echo "false" ;;
              *) echo "crates.io answered ${status} for ${name} ${version}" >&2; return 1 ;;
            esac
          }
          macros_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kio-macros") | .version')
          kio_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kio") | .version')
          macros=$(check_crate kio-macros "$macros_ver")
          kio=$(check_crate kio "$kio_ver")
          echo "macros=$macros" >> "$GITHUB_OUTPUT"
          echo "kio=$kio" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.macros == 'true' || needs.plan.outputs.kio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      # kio verifies, every feature on, against the kio-macros users will resolve: the
      # one this run publishes beside it, else the one already on crates.io.
      - if: needs.plan.outputs.macros == 'true'
        run: nix develop --command cargo package --locked --all-features -p kio-macros -p kio
      - if: needs.plan.outputs.macros != 'true'
        run: nix develop --command cargo package --locked --all-features -p kio

  publish-macros:
    needs: [plan, package]
    if: needs.plan.outputs.macros == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish kio-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p kio-macros

  publish-kio:
    needs: [plan, package, publish-macros]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.kio == 'true' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish kio
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p kio
