name: Release

# Publishes kio-macros then kio to crates.io when main carries a version crates.io lacks, tags
# what it published, then has release-plz open or regenerate the release PR that bumps those
# versions and writes the changelogs. Packaging runs in an unprivileged job before publishing
# so build scripts never run beside the OIDC token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      macros: ${{ steps.plan.outputs.macros }}
      kio: ${{ steps.plan.outputs.kio }}
      macros_version: ${{ steps.plan.outputs.macros_version }}
      kio_version: ${{ steps.plan.outputs.kio_version }}
      release_commit: ${{ steps.plan.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History, to find the commit that introduced a version.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          # Whether crates.io lacks the version; any answer but found or missing fails the
          # run, so an outage never passes for "already published".
          check_crate() {
            local name="$1" version="$2"
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "kixel-ai/kio release" \
              "https://crates.io/api/v1/crates/${name}/${version}")
            case "$status" in
              404) echo "true" ;;
              200) echo "false" ;;
              *) echo "crates.io answered ${status} for ${name} ${version}" >&2; return 1 ;;
            esac
          }
          macros_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kio-macros") | .version')
          kio_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kio") | .version')
          # The newest commit that touched a manifest's `version = "<version>"` line, which is
          # the one that set it. Packaging and publishing check it out, so a push that lands
          # after the release PR, or a rerun, never ships changes the release PR did not version.
          introduced() {
            local manifest="$1" version="$2"
            git log -1 --format=%H -G"^version = \"${version//./\\.}\"\$" -- "$manifest"
          }
          macros=$(check_crate kio-macros "$macros_ver")
          kio=$(check_crate kio "$kio_ver")
          release_commit=""
          if [[ "$macros" == true ]]; then
            release_commit=$(introduced macros/Cargo.toml "$macros_ver")
          fi
          if [[ "$kio" == true ]]; then
            kio_commit=$(introduced Cargo.toml "$kio_ver")
            if [[ -n "$release_commit" && "$release_commit" != "$kio_commit" ]]; then
              echo "kio ${kio_ver} and kio-macros ${macros_ver} were versioned in different commits" >&2
              exit 1
            fi
            release_commit="$kio_commit"
          fi
          if [[ ( "$macros" == true || "$kio" == true ) && -z "$release_commit" ]]; then
            echo "no commit set the unpublished version" >&2
            exit 1
          fi
          {
            echo "macros=$macros"
            echo "kio=$kio"
            echo "macros_version=$macros_ver"
            echo "kio_version=$kio_ver"
            echo "release_commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.macros == 'true' || needs.plan.outputs.kio == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.release_commit }}
          persist-credentials: false
      - uses: ./.github/actions/nix
      # kio verifies, every feature on, against the kio-macros users will resolve: the
      # one this run publishes beside it, else the one already on crates.io.
      - if: needs.plan.outputs.macros == 'true'
        run: nix develop --command cargo package --locked --all-features -p kio-macros -p kio
      - if: needs.plan.outputs.macros != 'true'
        run: nix develop --command cargo package --locked --all-features -p kio

  publish-macros:
    needs: [plan, package]
    if: needs.plan.outputs.macros == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.release_commit }}
          persist-credentials: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish kio-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p kio-macros

  publish-kio:
    needs: [plan, package, publish-macros]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.kio == 'true' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.release_commit }}
          persist-credentials: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish kio
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p kio

  # Tags each crate's manifest version that crates.io holds but has no tag, which is where
  # release-plz starts the next changelog. The tag goes on the commit crates.io recorded in the
  # package, so a run that failed after publishing is repaired by the next run, whatever main
  # holds by then. The job holds no crates.io credential, only the token to create a tag.
  tag:
    needs: [plan, publish-macros, publish-kio]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          MACROS_VERSION: ${{ needs.plan.outputs.macros_version }}
          KIO_VERSION: ${{ needs.plan.outputs.kio_version }}
        run: |
          tag_crate() {
            local crate="$1" prefix="$2" version="$3"
            local tag="${prefix}-v${version}" crate_file status sha
            # Only a 404 means the tag is missing; any other error must not pass for one.
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1); then
              return 0
            fi
            case "$out" in
              *"HTTP 404"*) ;;
              *) echo "${out}" >&2; return 1 ;;
            esac
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "kixel-ai/kio release" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            case "$status" in
              404) echo "${crate} ${version} is not published, so there is nothing to tag"; return 0 ;;
              200) ;;
              *) echo "crates.io answered ${status} for ${crate} ${version}" >&2; return 1 ;;
            esac
            # Published, so a failed download is an error, not a missing version.
            crate_file=$(mktemp)
            curl -sSfL -o "$crate_file" -A "kixel-ai/kio release" \
              "https://crates.io/api/v1/crates/${crate}/${version}/download"
            sha=$(tar -xzO -f "$crate_file" "${crate}-${version}/.cargo_vcs_info.json" | jq -er .git.sha1)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$sha" >/dev/null
            echo "tagged ${tag} at ${sha}"
          }
          tag_crate kio-macros macros "$MACROS_VERSION"
          tag_crate kio kio "$KIO_VERSION"

  # Opens, or regenerates, the release PR from main's commits since each crate's last tag. It
  # runs after publishing, so the tags and crates.io already hold what main's versions name.
  # The App key lives in the `release-pr` environment, which only main can deploy to, so a pull
  # request's workflow never reads it.
  pr:
    needs: [plan, tag]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: release-pr
    permissions:
      contents: read
    steps:
      # An App token, since GITHUB_TOKEN cannot open a PR here, and a PR it opened would not run
      # check.yml.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's tip, not this run's commit, so rerunning an old run never regenerates the
          # release PR from older commits.
          ref: refs/heads/main
          # Every tag and commit, since release-plz finds a crate's last release by its tag.
          fetch-depth: 0
          # release-plz pushes the release branch with this credential.
          token: ${{ steps.token.outputs.token }} # zizmor: ignore[artipacked]
      - uses: ./.github/actions/nix
      - run: nix develop .#release --command just release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
