name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Per ref; a started run finishes, so each landed commit's failure is reported against it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cargo-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'macros/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
      - run: nix develop --command just ci
        env:
          CARGO_INCREMENTAL: 0
      - if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cargo-paths
          key: ${{ steps.cargo.outputs.cache-primary-key }}

  # Proves src/log.rs's Verus proof. Separate from `check` so its shell skips Verus's
  # toolchain, and in parallel with it.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - run: nix develop .#verus --command just verify

  # Files or comments on the same issue as post-merge.yml's report.
  report:
    needs: [check, verify]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Post-merge CI failed
          BODY: "Check failed on ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          # Lists rather than searches, so an issue another run just opened is already visible.
          issue=$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
