[toolchain]
# The build toolchain, not the 1.91 library floor (`rust-version` in Cargo.toml).
# It has to be at least 1.98: below that, rustc strips Mach-O debuginfo with an
# llvm-objcopy that leaves the LINKEDIT string pool 4-byte aligned, and macOS 27's
# dyld refuses to load such an image, which makes a release-profile kio-macros a coin flip there.
# flake.nix reads this file, so the dev shell and CI follow it.
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-src"]
