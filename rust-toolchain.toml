[toolchain]
# The build toolchain, not the 1.91 library floor in Cargo.toml; flake.nix reads
# it from here. It has to be at least 1.98: below that, rustc strips Mach-O
# debuginfo with an llvm-objcopy that leaves the LINKEDIT string pool 4-byte
# aligned, and macOS 27's dyld refuses to load such an image, which makes every
# release-profile proc macro, kio-macros included, a coin flip there.
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-src"]
