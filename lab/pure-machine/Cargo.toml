# A lab spike, never published: moq-net's send credit and warm routing written as pure
# `kio::model::Machine`s, so kio's model checker, Kani, and Aeneas read the same Rust.
[package]
name = "kio-pure-machine"
description = "Spike: pure state machines, model checked and proved"
publish = false
version = "0.0.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
kio = { path = "../..", features = ["model"] }

[lints]
workspace = true
